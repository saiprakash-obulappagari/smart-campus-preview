<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Signup · Smart Campus</title>
  <link rel="stylesheet" href="style.css">
  <style>.auth-card{margin:30px auto}.auth-card h2{margin-top:0}.form-group input:focus,.form-group select:focus{outline:2px solid #6366f1;outline-offset:2px}.btn:disabled{opacity:.65;cursor:wait}#signupMessage{line-height:1.5}a{color:#4f46e5}</style>
</head>
<body>
  <main class="auth">
    <section class="hero"><span class="pill">Smart Campus · Faculty</span><h1>Help every student move forward.</h1><p>Create your faculty account to review student progress and share personalized improvement tasks.</p></section>
    <section class="auth-card" aria-labelledby="signupTitle">
      <h2 id="signupTitle">Faculty Signup</h2><p class="label">Join Smart Campus Analytics</p>
      <form id="facultySignup">
        <div class="form-group"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
        <div class="form-group"><label for="facultyId">Faculty ID</label><input id="facultyId" name="facultyId" maxlength="30" required></div>
        <div class="form-group"><label for="email">College email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="150" required></div>
        <div class="form-group"><label for="department">Department</label><select id="department" name="department" required><option value="">Select department</option><option>CSE</option><option>ECE</option><option>IT</option><option>EEE</option><option>MECH</option><option>Civil</option><option>Other</option></select></div>
        <div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><small class="label">At least 8 characters</small></div>
        <div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" required></div>
        <p id="signupMessage" role="status" aria-live="polite"></p>
        <button id="signupButton" class="btn primary full" type="submit">Create Faculty Account</button>
      </form>
      <p style="text-align:center">Already registered? <a href="index.html?role=faculty">Faculty login</a></p>
    </section>
  </main>
  <script src="faculty-signup.js"></script>
</body>
</html>
